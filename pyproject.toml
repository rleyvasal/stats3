[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stats3"
dynamic = ["version"]
description = "R's statistical tests on Polars, for Polars, pandas and tidy3 data, with R's results"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rigoberto Leyva Salmeron" }]
keywords = ["statistics", "hypothesis tests", "polars", "pandas", "tidyverse", "R"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  # Summary statistics for every group come from one Polars query.
  "polars>=1.39",
  # p-values and intervals come from scipy's distribution functions
  # (Polars has none); NumPy arrives with scipy. 1.18 is the first whose
  # inverse t and Shapiro-Wilk match R to full precision.
  "scipy>=1.18",
]

[project.optional-dependencies]
bayes = ["pymc>=6.3,<7", "arviz>=1.1,<2"]
# Compiled kernels for R's row-by-row algorithms (k-means transfers, the
# hclust chain, distances, concordance): the same results, at R's speed on
# large data. 0.60 is the first Numba release for NumPy 2.
fast = ["numba>=0.60"]
# pandas frames in and out: Polars converts them through pyarrow (the
# first releases built for NumPy 2, which scipy 1.18 needs).
pandas = ["pandas>=2.2.2", "pyarrow>=16"]
dev = [
  "pytest>=7.0",
  "pandas>=2.2.2",
  "pyarrow>=16",
  # Only to test that tidy3 frames, groups and expressions work.
  "tidy3>=0.8.2",
  # The compiled path is checked against the NumPy path.
  "numba>=0.60",
  "ipython>=8.0",
]

[project.urls]
Homepage = "https://github.com/rleyvasal/stats3"
Changelog = "https://github.com/rleyvasal/stats3/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "stats3.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stats3 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
