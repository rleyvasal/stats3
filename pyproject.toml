[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stats3"
dynamic = ["version"]
description = "R's statistical tests on Polars, for Polars, pandas and tidy3 data, with R's results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rigoberto Leyva Salmeron" }]
keywords = ["statistics", "hypothesis tests", "polars", "pandas", "tidyverse", "R"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  # Summary statistics for every group come from one Polars query.
  "polars>=1.39",
  # p-values and intervals come from scipy's distribution functions
  # (Polars has none); NumPy arrives with scipy.
  "scipy>=1.10",
]

[project.optional-dependencies]
# pandas frames in and out: Polars converts them through pyarrow.
pandas = ["pandas>=2.0", "pyarrow>=14"]
dev = [
  "pytest>=7.0",
  "pandas>=2.0",
  "pyarrow>=14",
  # Only to test that tidy3 frames, groups and expressions work.
  "tidy3>=0.8.1",
  "ipython>=8.0",
]

[project.urls]
Homepage = "https://github.com/rleyvasal/stats3"
Changelog = "https://github.com/rleyvasal/stats3/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "stats3.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stats3 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
