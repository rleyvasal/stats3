name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest versions stats3 supports, where R parity was checked.
          - python-version: "3.12"
            deps: minimum
          - python-version: "3.13"
            deps: latest
          - python-version: "3.14"
            deps: latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install stats3
        run: python -m pip install -e ".[dev]"
      - name: Pin the minimum versions
        if: matrix.deps == 'minimum'
        run: python -m pip install "polars==1.39.*" "scipy==1.18.0" "pandas==2.2.2" "pyarrow==16.*" "tidy3==0.8.2"
      # Without R the oracle comparisons skip; the SciPy comparisons, the
      # backend tests and everything else still run.
      - name: Run tests
        run: python -m pytest -q --tb=short

  # Polars and SciPy only: everything that needs pandas, tidy3 or IPython
  # must skip cleanly, not fail.
  bare:
    name: pytest (Polars and SciPy only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stats3 without extras
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q --tb=short

  bayes:
    name: Bayesian extra (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Bayesian and test dependencies
        run: python -m pip install -e ".[dev,bayes]"
      - name: Run exact and sampled Bayesian checks
        run: python -m pytest -q tests/test_bayes.py tests/test_bayes_sampling.py tests/test_masking.py --tb=short

  # Every R comparison, against R's own results.
  r-oracle:
    name: R oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr", "jsonlite", "sandwich", "lmtest", "emmeans", "MASS", "quantreg")); library(emmeans); library(MASS); library(quantreg)'
      - name: Install stats3
        run: python -m pip install -e ".[dev]"
      - name: Check the oracle runs
        run: python -c "import sys; sys.path.insert(0, 'tests'); import oracle; assert oracle.R_COMMAND, 'R oracle unavailable'"
      - name: Run tests with the R oracle
        run: python -m pytest -q --tb=short
