name: publish

# Push a tag such as v0.1.0 to test, build, and upload that version to PyPI.
# Uses PyPI trusted publishing, so no token or password is stored anywhere.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    # R's results and stats3's depend on which OpenBLAS kernels run: the
    # runners' CPUs vary, and OpenBLAS picks kernels by CPU, which moves
    # last bits that decide ties and near-degenerate choices, in R as well
    # as in NumPy. One kernel family and one thread make every run compute
    # alike.
    env:
      OPENBLAS_CORETYPE: Nehalem
      OPENBLAS_NUM_THREADS: "1"
    runs-on: ubuntu-latest
    # A stalled R install fails the run instead of holding it for hours.
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'pkgs <- c("dplyr", "jsonlite", "sandwich", "lmtest", "emmeans", "MASS", "quantreg", "car", "broom", "survival", "nnet", "mgcv", "lme4", "glmnet"); install.packages(pkgs); for (p in pkgs) library(p, character.only = TRUE)'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q --tb=short

  build:
    timeout-minutes: 15
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches src/stats3/__version__.py
        run: |
          version=$(python -c "exec(open('src/stats3/__version__.py').read()); print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stats3
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    timeout-minutes: 15
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
